|<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Acceso - Mi App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Bootstrap -->
  <!-- App Design System -->
  
  <!-- Bootstrap (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- App unified CSS -->
  <link rel="stylesheet" href="./style.ds.css">

</head>
<body class="logged-out">

  <main class="auth-container">
    <h1>Bienvenido a tu plan</h1>
    <p>Inicia sesión o crea tu cuenta para continuar.</p>

    <!-- LOGIN -->
    <section class="auth-block">
      <h2>Iniciar sesión</h2>
      <form id="formLogin" class="auth-form">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Contraseña" required />
        <button type="submit">Entrar</button>
      </form>
    </section>

    <!-- REGISTRO -->
    <section class="auth-block">
      <h2>Crear cuenta</h2>
      <form id="formRegister" class="auth-form">
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Contraseña (mín. 6 caracteres)" required />
        <button type="submit">Registrarme</button>
      </form>
    </section>

    <p id="authMessage" class="auth-message"></p>
  </main>

  <!-- IMPORTANTE: script como módulo -->
  <script type="module" src="auth.js"></script>
</body>
</html>
